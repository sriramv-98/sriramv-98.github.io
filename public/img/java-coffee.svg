<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="An illustration of a steaming coffee mug">
  <rect width="400" height="300" fill="#f4f2ea"/>

  <!-- hard shadow duplicate (neobrutalist offset shadow) -->
  <g transform="translate(8,8)">
    <rect x="120" y="150" width="140" height="100" rx="10" fill="#111111"/>
    <ellipse cx="190" cy="250" rx="90" ry="14" fill="#111111"/>
  </g>

  <!-- saucer -->
  <ellipse cx="180" cy="240" rx="90" ry="14" fill="#f3b4ae" stroke="#111111" stroke-width="6"/>

  <!-- mug handle -->
  <path d="M250 155 h30 a25 25 0 0 1 0 70 h-30 z" fill="#ffffff" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- mug body -->
  <rect x="110" y="140" width="140" height="100" rx="10" fill="#ffffff" stroke="#111111" stroke-width="6"/>

  <!-- coffee surface -->
  <path d="M116 148 h128 v14 a64 8 0 0 1 -128 0 z" fill="#8a5a3b" stroke="#111111" stroke-width="4"/>

  <!-- "JAVA" print on the mug -->
  <text x="180" y="205" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="30" fill="#111111" letter-spacing="2">JAVA</text>

  <!-- steam -->
  <path d="M140 120 c-14 -16 10 -24 -4 -44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  <path d="M180 120 c-14 -18 12 -26 -4 -48" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  <path d="M220 120 c-14 -16 10 -24 -4 -44" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>

  <!-- a couple of coffee beans for flavor -->
  <g stroke="#111111" stroke-width="4">
    <ellipse cx="320" cy="70" rx="16" ry="22" fill="#c3e4d8" transform="rotate(20 320 70)"/>
    <path d="M320 50 v40" transform="rotate(20 320 70)"/>
    <ellipse cx="60" cy="60" rx="14" ry="19" fill="#f3b4ae" transform="rotate(-15 60 60)"/>
    <path d="M60 43 v34" transform="rotate(-15 60 60)"/>
  </g>
</svg>
