<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Diagram of a single node connecting through a stack of three layers to two separate nodes">
  <rect width="400" height="300" fill="#f4f2ea"/>

  <!-- left node -->
  <g transform="translate(6,6)">
    <rect x="40" y="125" width="60" height="60" rx="10" fill="#111111"/>
  </g>
  <rect x="34" y="119" width="60" height="60" rx="10" fill="#f3b4ae" stroke="#111111" stroke-width="5"/>

  <!-- arrow left -> middle -->
  <path d="M96 149 h44" stroke="#111111" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M138 141 l16 8 l-16 8 z" fill="#111111"/>

  <!-- middle stack (3 layers) -->
  <g transform="translate(6,6)">
    <rect x="164" y="70" width="90" height="150" rx="10" fill="#111111"/>
  </g>
  <rect x="158" y="64" width="90" height="150" rx="10" fill="#ffffff" stroke="#111111" stroke-width="5"/>
  <rect x="170" y="78" width="66" height="34" rx="5" fill="#c3e4d8" stroke="#111111" stroke-width="3"/>
  <rect x="170" y="122" width="66" height="34" rx="5" fill="#c3e4d8" stroke="#111111" stroke-width="3"/>
  <rect x="170" y="166" width="66" height="34" rx="5" fill="#c3e4d8" stroke="#111111" stroke-width="3"/>

  <!-- arrows middle -> right nodes -->
  <path d="M256 110 h30" stroke="#111111" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M280 102 l16 8 l-16 8 z" fill="#111111"/>

  <path d="M256 185 h30" stroke="#111111" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M280 177 l16 8 l-16 8 z" fill="#111111"/>

  <!-- right node A -->
  <g transform="translate(6,6)">
    <rect x="304" y="80" width="60" height="55" rx="10" fill="#111111"/>
  </g>
  <rect x="298" y="74" width="60" height="55" rx="10" fill="#f3b4ae" stroke="#111111" stroke-width="5"/>

  <!-- right node B -->
  <g transform="translate(6,6)">
    <rect x="304" y="155" width="60" height="55" rx="10" fill="#111111"/>
  </g>
  <rect x="298" y="149" width="60" height="55" rx="10" fill="#f3b4ae" stroke="#111111" stroke-width="5"/>
</svg>
