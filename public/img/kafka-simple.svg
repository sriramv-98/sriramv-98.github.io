<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Simplified diagram of a producer writing to a Kafka topic split into partitions, read by two consumers">
  <rect width="400" height="300" fill="#f4f2ea"/>

  <!-- Producer -->
  <g transform="translate(6,6)">
    <rect x="20" y="115" width="80" height="60" rx="8" fill="#111111"/>
  </g>
  <rect x="14" y="109" width="80" height="60" rx="8" fill="#f3b4ae" stroke="#111111" stroke-width="5"/>
  <text x="54" y="144" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="15" fill="#111111">Producer</text>

  <!-- arrow producer -> topic -->
  <path d="M96 139 h34" stroke="#111111" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M122 131 l16 8 l-16 8 z" fill="#111111"/>

  <!-- Topic box -->
  <g transform="translate(6,6)">
    <rect x="146" y="70" width="120" height="150" rx="8" fill="#111111"/>
  </g>
  <rect x="140" y="64" width="120" height="150" rx="8" fill="#ffffff" stroke="#111111" stroke-width="5"/>
  <text x="200" y="86" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="13" fill="#111111">TOPIC</text>

  <rect x="152" y="96" width="96" height="34" rx="4" fill="#c3e4d8" stroke="#111111" stroke-width="3"/>
  <text x="200" y="117" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12" fill="#111111">Partition 0</text>

  <rect x="152" y="136" width="96" height="34" rx="4" fill="#c3e4d8" stroke="#111111" stroke-width="3"/>
  <text x="200" y="157" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12" fill="#111111">Partition 1</text>

  <rect x="152" y="176" width="96" height="34" rx="4" fill="#c3e4d8" stroke="#111111" stroke-width="3"/>
  <text x="200" y="197" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12" fill="#111111">Partition 2</text>

  <!-- arrows topic -> consumers -->
  <path d="M262 110 h30" stroke="#111111" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M286 102 l16 8 l-16 8 z" fill="#111111"/>

  <path d="M262 175 h30" stroke="#111111" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M286 167 l16 8 l-16 8 z" fill="#111111"/>

  <!-- Consumer A -->
  <g transform="translate(6,6)">
    <rect x="308" y="80" width="80" height="55" rx="8" fill="#111111"/>
  </g>
  <rect x="302" y="74" width="80" height="55" rx="8" fill="#f3b4ae" stroke="#111111" stroke-width="5"/>
  <text x="342" y="98" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="13" fill="#111111">Consumer</text>
  <text x="342" y="115" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="13" fill="#111111">A</text>

  <!-- Consumer B -->
  <g transform="translate(6,6)">
    <rect x="308" y="145" width="80" height="55" rx="8" fill="#111111"/>
  </g>
  <rect x="302" y="139" width="80" height="55" rx="8" fill="#f3b4ae" stroke="#111111" stroke-width="5"/>
  <text x="342" y="163" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="13" fill="#111111">Consumer</text>
  <text x="342" y="180" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="13" fill="#111111">B</text>

  <text x="200" y="250" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#111111aa">one producer, many partitions, many consumers</text>
</svg>
